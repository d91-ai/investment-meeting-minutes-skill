interface:
  display_name: "投资会议纪要整理"
  short_description: "中文投资会议录音/文本转纪要，含标的校对与Obsidian导出"
  default_prompt: "请使用 investment-meeting-minutes Skill，整理「输入文件路径」。这是文稿输入，按「多人复盘会／公司交流／专家交流」处理。保留原始发言顺序、第一人称、观点强度、条件和时间信息；修正明显转写错误，核验公司名称和股票代码，无法确认的内容列入“存疑与待确认”。严格执行完整审核链，所有审核结果必须落实到最终文档；审核未完成或存在流程阻塞时不得导出，应直接说明未完成环节。最终输出为「完整输出路径及文件名.md」。"
