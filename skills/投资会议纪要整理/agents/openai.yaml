interface:
  display_name: "投资会议纪要整理"
  short_description: "中文投资会议录音/文本转纪要，含标的校对与Obsidian导出"
  default_prompt: "请使用 investment-meeting-minutes Skill，整理用户提供的会议材料。这是会议原始材料，请确认并按“多人复盘会”“公司交流”或“专家交流”之一处理。保留原始发言顺序、发言人和第一人称，修正明显转写错误，核验公司名称和股票代码，无法确认的内容列入存疑表。严格执行完整审核链，审核未完成不得导出。最终按照用户指定的文件名和目录输出 Markdown。"
